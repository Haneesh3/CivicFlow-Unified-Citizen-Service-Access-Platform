

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: civicflow_db
    environment:
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow_password
      POSTGRES_DB: civicflow
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: civicflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
